<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Peserta</title>

    <style>
        /* Mengatur seluruh halaman */
        body {
        font-family: Arial, sans-serif;
        background-color: white;
        margin: 0;
        padding: 15px;
        color: #333;
        }

        /* Kotak utama */
        .container {
        width: 420px;
        margin: auto;
        padding: 5px;
        background-color: #f1f7fd;
        }

        /* Judul halaman */
        h2 {
        text-align: center;
        color: #f4f5f8;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 10px;
        }

        /* Kotak form */
        form {
        background-color: white;
        border: 1px solid #d5e0e8;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 11px;
        }

        /* Jarak setiap baris form */
        .form-group {
        margin-bottom: 5px;
        }

        /* Input teks */
        input[type="text"] {
        font-family: Arial, sans-serif;
        font-size: 11px;
        padding: 2px;
        border: 1px solid #999;
        }

        /* Select jurusan */
        select {
        font-family: Arial, sans-serif;
        font-size: 11px;
        }

        /* Tombol kirim */
        button {
        background-color: #245bb5;
        color: white;
        border: none;
        padding: 5px 12px;
        font-size: 11px;
        cursor: pointer;
        }

        /* Tabel data */
        table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
        font-size: 11px;
        }

        /* Sel tabel */
        th,td {
        border: 1px solid #f8f9fa;
        padding: 5px;
        text-align: left;
        }

        /* Header tabel */
        th {
        background-color: #245bb5;
        color: rgb(249, 249, 252);
        text-align: center;
        }

    </style>
</head>
<body>   
<div class="container">

    <h2>Pendaftaran Peserta</h2>

    <!-- Form pendaftaran -->
    <form>
        <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" value="Budi Santoso">
        </div>

        <div class="form-group">
            <label>Jenis Kelamin:</label>
            <input type="radio" name="gender" value="L"> L
            <input type="radio" name="gender" value="P"> P
        </div>

        <div class="form-group">
            <label>Jurusan:</label>
            <select>
            <option>Informatika</option>
            <option>Sistem Informasi</option>
            </select>
        </div>

        <button type="button">Kirim</button>
    </form>

    <!-- Tabel daftar peserta -->
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Jurusan</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Budi Santoso</td>
                <td>Informatika</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sari Wulandari</td>
                <td>Sistem Informasi</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
